* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --navy:       #094e58;
  --navy-dark:  #072e37;
  --navy-mid:   #0d6b79;
  --bg:         #f5f0e8;
  --bg-card:    #ffffff;
  --text-dark:  #122830;
  --text-mid:   #2d5a65;
  --text-muted: #6b8e96;
  --orange:     #e8821e;
  --teal:       #14b8a6;
  --border:     #dde8ea;
  --text:       #122830;
  --muted:      #6b8e96;
}
[data-theme="emerald"]  { --navy:#065f46; --navy-dark:#064e3b; --navy-mid:#047857; --bg:#f0fdf4; --text-dark:#022c22; --text-mid:#166534; --orange:#f59e0b; --teal:#10b981; --border:#bbf7d0; --text:#022c22; --muted:#166534; }
[data-theme="charcoal"] { --navy:#1c1c2e; --navy-dark:#0f0f1a; --navy-mid:#2d2d44; --bg:#f5f5f7; --text-dark:#1c1c2e; --text-mid:#44445a; --orange:#e85d04; --teal:#4cc9f0; --border:#dcdce4; --text:#1c1c2e; --muted:#44445a; }
[data-theme="violet"]   { --navy:#4c1d95; --navy-dark:#2e1065; --navy-mid:#6d28d9; --bg:#f5f3ff; --text-dark:#1e1b4b; --text-mid:#4338ca; --orange:#f59e0b; --teal:#06b6d4; --border:#ddd6fe; --text:#1e1b4b; --muted:#4338ca; }
[data-theme="rose"]     { --navy:#881337; --navy-dark:#4c0519; --navy-mid:#be123c; --bg:#fff1f2; --text-dark:#1c0508; --text-mid:#9f1239; --orange:#f97316; --teal:#0891b2; --border:#fecdd3; --text:#1c0508; --muted:#9f1239; }
[data-version="1"]      { --navy:#2e3192; --navy-dark:#1e2166; --navy-mid:#3730a3; --bg:#f0f0f6; --orange:#f97316; --teal:#0891b2; --border:#d4d4e8; --text-dark:#1a1a3e; --text-mid:#4a4a6a; --text-muted:#8888aa; --text:#1a1a3e; --muted:#7070a0; }

body {
  background: var(--bg);
  font-family: 'Lato', sans-serif;
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}

/* Subtle grid on bg */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(46,49,146,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(46,49,146,0.04) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}

/* ── Header matching DIGILAB site ── */
header {
  position: fixed; top: 0; left: 0; right: 0;
  height: 66px;
  background: var(--navy);
  border-bottom: none;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px;
  z-index: 200;
  box-shadow: 0 2px 12px rgba(0,0,0,.22);
}

.h-left { display: flex; align-items: center; gap: 14px; }

.h-logo { width: 44px; height: 44px; flex-shrink: 0; }

.h-texts {}
.h-title {
  font-family: 'Nunito', sans-serif;
  font-size: 14.5px; font-weight: 900; color: #fff;
  letter-spacing: .4px; line-height: 1.15;
}
.h-subtitle { font-size: 10px; color: rgba(255,255,255,.72); font-weight: 300; letter-spacing: .3px; }

.h-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 20px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: rgba(255,255,255,.9);
  font-family: 'Nunito', sans-serif;
}

.h-badge-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--orange);
  animation: pulse-dot 2s infinite;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.7); }
}

.h-right { display: flex; align-items: center; gap: 12px; }

.tabs {
  display: flex; gap: 2px;
  background: rgba(255,255,255,0.1);
  border-radius: 8px; padding: 3px;
}

.tab-btn {
  padding: 5px 14px; border-radius: 6px;
  font-size: 11.5px; font-weight: 700;
  cursor: pointer; border: none;
  background: transparent; color: rgba(255,255,255,.55);
  font-family: 'Nunito', sans-serif;
  letter-spacing: 0.03em; transition: all 0.2s;
}

.tab-btn.active {
  background: rgba(255,255,255,0.18);
  color: #fff;
}

.tab-btn:hover:not(.active) { color: rgba(255,255,255,.8); }

.btn-back {
  padding: 6px 16px; border-radius: 20px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2);
  color: rgba(255,255,255,.85); font-family: 'Nunito',sans-serif;
  font-weight: 700; font-size: 11px; cursor: pointer;
  transition: background .15s; text-decoration: none;
  display: inline-flex; align-items: center;
}
.btn-back:hover { background: rgba(255,255,255,0.22); }

#canvas {
  position: fixed; top: 66px; left: 0; right: 0; bottom: 0;
  z-index: 1;
}

svg { width: 100%; height: 100%; cursor: grab; }
svg:active { cursor: grabbing; }

.link-path { fill: none; transition: opacity 0.3s; }

/* Node animations */
.node-g { transition: opacity 0.3s; }
.node-g circle { transition: r 0.2s cubic-bezier(.34,1.56,.64,1), filter 0.2s; }
.node-g:hover circle { filter: drop-shadow(0 0 6px currentColor); }

/* Root pulse animation */
@keyframes root-pulse {
  0%,100% { r: 44; }
  50%      { r: 48; }
}
.node-root circle { animation: root-pulse 3s ease-in-out infinite; }

/* Branch float animation */
@keyframes float-node {
  0%,100% { transform: translateY(0px); }
  50%      { transform: translateY(-3px); }
}
.node-branch { animation: float-node 4s ease-in-out infinite; }

/* Detail Panel — clean white */
#panel {
  position: fixed; right: 0; top: 66px; bottom: 0;
  width: 300px;
  background: var(--bg-card);
  border-left: 1.5px solid var(--border);
  padding: 28px 22px 28px 24px;
  transform: translateX(100%);
  transition: transform 0.38s cubic-bezier(0.25,0.46,0.45,0.94);
  z-index: 300; overflow-y: auto;
  box-shadow: -4px 0 20px rgba(46,49,146,.08);
}

#panel.open { transform: translateX(0); }

.panel-close {
  position: absolute; top: 18px; right: 18px;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--bg);
  border: 1.5px solid var(--border);
  color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; transition: all 0.2s; font-weight: 700;
}
.panel-close:hover { background: var(--border); color: var(--text); }

.panel-tag {
  display: inline-block; padding: 3px 10px;
  border-radius: 20px; font-size: 9px; font-weight: 800;
  letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 14px;
  font-family: 'Nunito', sans-serif;
}

.panel-title {
  font-family: 'Nunito', sans-serif;
  font-size: 20px; font-weight: 900; margin-bottom: 12px; line-height: 1.25;
  color: var(--text);
}

.panel-body {
  font-size: 13px; line-height: 1.75;
  color: var(--muted); margin-bottom: 18px;
}

.panel-list { display: flex; flex-direction: column; gap: 7px; }

.panel-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 9px 12px; border-radius: 8px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  font-size: 12px; color: var(--text); line-height: 1.4;
}

.panel-item-dot {
  width: 6px; height: 6px; border-radius: 50%;
  flex-shrink: 0; margin-top: 4px;
}

/* Legend */
#legend {
  position: fixed; bottom: 28px; left: 28px;
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: 12px; padding: 14px 18px;
  z-index: 100;
  box-shadow: 0 2px 10px rgba(46,49,146,.08);
}

.legend-title {
  font-size: 9px; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--muted);
  font-weight: 700; margin-bottom: 10px;
}

.legend-items { display: flex; flex-direction: column; gap: 6px; }

.legend-item { display: flex; align-items: center; gap: 9px; font-size: 11px; color: #64748b; }

.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* Jadwal */
#jadwal-view {
  position: fixed; top: 66px; left: 0; right: 0; bottom: 0;
  padding: 40px 40px 60px; overflow-y: auto; display: none; z-index: 1;
  background: var(--bg);
}

.jadwal-title {
  font-family: 'Nunito', sans-serif;
  font-size: 26px; font-weight: 900; margin-bottom: 6px; color: var(--navy);
}

.jadwal-sub { font-size: 13px; color: var(--muted); margin-bottom: 32px; }

.jadwal-table-wrapper {
  overflow-x: auto;
  background: var(--bg-card);
  border-radius: 12px;
  border: 1.5px solid var(--border);
  box-shadow: 0 2px 10px rgba(46,49,146,.06);
}

.jadwal-table { border-collapse: collapse; width: 100%; font-size: 12px; }

.jadwal-table th {
  padding: 10px 12px; text-align: center;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); border-bottom: 1.5px solid var(--border);
  font-family: 'Nunito', sans-serif;
}

.jadwal-table th:first-child { text-align: left; min-width: 200px; width: 200px; }

.jadwal-table td {
  padding: 10px 12px; border-bottom: 1px solid var(--border);
  vertical-align: middle;
}

.jadwal-table td:first-child { color: var(--text); font-size: 12px; font-weight: 600; }

.jadwal-table tr:last-child td { border-bottom: none; }
.jadwal-table tr:hover td { background: var(--bg); }

.jadwal-bar {
  width: 26px; height: 8px; border-radius: 4px; margin: 0 auto; opacity: 0.8;
}

.hint {
  position: fixed; bottom: 24px; right: 24px;
  font-size: 10px; color: var(--muted); z-index: 100;
  background: var(--bg-card); padding: 4px 10px;
  border-radius: 20px; border: 1px solid var(--border);
}
</style>
</head>

// ─── MINDMAP ───
const svgEl = d3.select('#svg');
let g, zoomBehavior;

function getRadius(d) {
  if (d.depth === 0) return 44;
  if (d.depth === 1) return 18;
  if (d.depth === 2) return 12;
  return 8;
}

function getBranchColor(d) {
  if (d.depth === 0) return '#2e3192';
  let p = d;
  while (p.depth > 1) p = p.parent;
  return p.data.color || '#7070a0';
}

function initMindmap() {
  const canvasEl = document.getElementById('canvas');
  const W = canvasEl.clientWidth  || window.innerWidth;
  const H = canvasEl.clientHeight || (window.innerHeight - 66);

  svgEl.selectAll('*').remove();

  zoomBehavior = d3.zoom()
    .scaleExtent([0.25, 3.5])
    .on('zoom', e => g.attr('transform', e.transform));

  svgEl.call(zoomBehavior);

  g = svgEl.append('g');

  // Defs
  const defs = svgEl.append('defs');

  const glow = defs.append('filter').attr('id', 'glow');
  glow.append('feGaussianBlur').attr('stdDeviation', '3.5').attr('result', 'blur');
  const m1 = glow.append('feMerge');
  m1.append('feMergeNode').attr('in', 'blur');
  m1.append('feMergeNode').attr('in', 'SourceGraphic');

  const rglow = defs.append('filter').attr('id', 'root-glow');
  rglow.append('feGaussianBlur').attr('stdDeviation', '10').attr('result', 'blur');
  const m2 = rglow.append('feMerge');
  m2.append('feMergeNode').attr('in', 'blur');
  m2.append('feMergeNode').attr('in', 'SourceGraphic');

  const root = d3.hierarchy(treeData);
  const radius = Math.min(W * 0.42, H * 0.42);

  const tree = d3.tree()
    .size([2 * Math.PI, radius])
    .separation((a, b) => (a.parent === b.parent ? 1 : 2) / a.depth);

  tree(root);

  // Links
  g.selectAll('.link-path')
    .data(root.links())
    .enter().append('path')
    .attr('class', 'link-path')
    .attr('d', d3.linkRadial().angle(d => d.x).radius(d => d.y))
    .attr('stroke', d => getBranchColor(d.target))
    .attr('stroke-opacity', d => d.target.depth === 1 ? 0.55 : 0.3)
    .attr('stroke-width', d => d.target.depth === 1 ? 2 : 1.2)
    .attr('stroke-dasharray', function() {
      try { return this.getTotalLength(); } catch(e) { return 1000; }
    })
    .attr('stroke-dashoffset', function() {
      try { return this.getTotalLength(); } catch(e) { return 1000; }
    })
    .transition().duration(900).delay((d, i) => i * 18)
    .attr('stroke-dashoffset', 0);

  // Nodes
  const node = g.selectAll('.node-g')
    .data(root.descendants())
    .enter().append('g')
    .attr('class', d => `node-g ${d.depth === 0 ? 'node-root' : d.depth === 1 ? 'node-branch' : ''}`)
    .attr('transform', d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0)`)
    .style('cursor', d => d.data.detail ? 'pointer' : 'default')
    .attr('opacity', 0)
    .on('click', (e, d) => { if (d.data.detail) showPanel(d.data); })
    .on('mouseenter', function(e, d) {
      if (d.data.type !== 'root') {
        d3.select(this).select('circle')
          .attr('r', getRadius(d) + 3)
          .attr('filter', 'url(#glow)');
      }
    })
    .on('mouseleave', function(e, d) {
      d3.select(this).select('circle')
        .attr('r', getRadius(d))
        .attr('filter', d.data.type === 'root' ? 'url(#root-glow)' : null);
    });

  node.transition().duration(400).delay((d, i) => i * 25 + 200).attr('opacity', 1);

  node.append('circle')
    .attr('r', d => getRadius(d))
    .attr('fill', d => {
      const c = getBranchColor(d);
      if (d.depth === 0) return '#ffffff';
      if (d.depth === 1) return '#ffffff';
      return '#ffffff';
    })
    .attr('stroke', d => getBranchColor(d))
    .attr('stroke-width', d => d.depth === 0 ? 2.5 : d.depth === 1 ? 2 : 1.5)
    .attr('stroke-opacity', d => d.depth === 0 ? 1 : d.depth === 1 ? 0.9 : d.depth === 2 ? 0.6 : 0.4)
    .attr('filter', null);



  // Labels — root: text inside circle; others: text outside radially
  node.append('text')
    .attr('text-anchor', d => {
      if (d.depth === 0) return 'middle';
      return d.x > Math.PI ? 'end' : 'start';
    })
    .attr('transform', d => {
      const angle = d.x * 180 / Math.PI - 90;
      if (d.depth === 0) return `rotate(${-angle})`;
      const r = getRadius(d) + 6;
      const sign = d.x > Math.PI ? -1 : 1;
      return `translate(${sign * r}, 0) rotate(${-angle})`;
    })
    .attr('font-family', "'Nunito', sans-serif")
    .attr('font-size', d => d.depth === 0 ? '12px' : d.depth === 1 ? '10.5px' : d.depth === 2 ? '9.5px' : '8.5px')
    .attr('font-weight', d => d.depth <= 1 ? '800' : '600')
    .attr('fill', d => {
      if (d.depth === 0) return '#2e3192';
      return getBranchColor(d);
    })
    .attr('opacity', d => d.depth <= 2 ? 1 : 0.8)
    .attr('dy', '0.35em')
    .each(function(d) {
      const el = d3.select(this);
      const lines = d.data.name.split('\n');
      if (lines.length === 1) {
        el.text(d.data.name);
      } else {
        el.attr('dy', null);
        lines.forEach((line, i) => {
          el.append('tspan')
            .attr('x', 0)
            .attr('dy', i === 0 ? `${-(lines.length - 1) * 0.6}em` : '1.2em')
            .text(line);
        });
      }
    });

  svgEl.call(zoomBehavior.transform, d3.zoomIdentity.translate(W / 2, H / 2));
}

// ─── PANEL ───
function showPanel(data) {
  const d = data.detail;
  document.getElementById('panel-tag').textContent = d.tag;
  Object.assign(document.getElementById('panel-tag').style, {
    background: d.color + '22',
    color: d.color,
    border: `1px solid ${d.color}55`
  });
  document.getElementById('panel-title').textContent = d.title;
  document.getElementById('panel-title').style.color = d.color;
  document.getElementById('panel-body').textContent = d.body;
  document.getElementById('panel-list').innerHTML = d.items.map(item => `
    <div class="panel-item">
      <div class="panel-item-dot" style="background:${d.color}"></div>
      <span>${item}</span>
    </div>
  `).join('');
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
}

// ─── JADWAL ───
function renderJadwal() {
  const phaseColors = ['#f59e0b','#f59e0b','#10b981','#8b5cf6','#8b5cf6','#8b5cf6','#8b5cf6','#f43f5e','#3b82f6','#3b82f6','#3b82f6'];
  const months = Array.from({length: 11}, (_, i) => i + 1);
  document.getElementById('jadwal-view').innerHTML =
    '<div class="jadwal-title">Jadwal Penelitian</div>'
    + '<div class="jadwal-sub">Timeline 11 Bulan — Tahun ke-1 · Hibah Skripsi UM 2026</div>'
    + '<div class="jadwal-table-wrapper"><table class="jadwal-table"><thead><tr>'
    + '<th>Kegiatan</th>'
    + months.map(function(m){ return '<th>Bln ' + m + '</th>'; }).join('')
    + '</tr></thead><tbody>'
    + jadwalData.map(function(row){
        return '<tr><td>' + row.no + '. ' + row.nama + '</td>'
          + months.map(function(m){
              return '<td>' + (row.bulan.includes(m)
                ? '<div class="jadwal-bar" style="background:' + phaseColors[m-1] + '"></div>'
                : '') + '</td>';
            }).join('')
          + '</tr>';
      }).join('')
    + '</tbody></table></div>';
}

// ─── TAB SWITCH ───
function switchTab(view, btn) {
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  var canvas = document.getElementById('canvas');
  var jadwal = document.getElementById('jadwal-view');
  var legend = document.getElementById('legend');
  if (view === 'mindmap') {
    canvas.style.display = 'block';
    jadwal.style.display = 'none';
    if (legend) legend.style.display = 'block';
    var svg = canvas.querySelector('svg');
    if (!svg || svg.querySelectorAll('circle').length === 0) {
      requestAnimationFrame(function(){ requestAnimationFrame(initMindmap); });
    }
  } else {
    canvas.style.display = 'none';
    jadwal.style.display = 'block';
    if (legend) legend.style.display = 'none';
    renderJadwal();
  }
}

// ─── INIT ───
window.addEventListener('resize', function() {
  var canvas = document.getElementById('canvas');
  if (canvas && canvas.style.display !== 'none') {
    requestAnimationFrame(initMindmap);
  }
});

document.addEventListener('DOMContentLoaded', function() {
  renderJadwal();
  requestAnimationFrame(function(){ requestAnimationFrame(initMindmap); });
});
</script>
