<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Changelog — DIGILAB Repository</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --navy:   #2e3192;
  --navy-dk:#1e2070;
  --orange: #f97316;
  --bg:     #eeeef5;
  --white:  #ffffff;
  --border: #d1d5db;
  --text:   #1f2937;
  --muted:  #6b7280;
}
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

/* Header */
header {
  background:var(--navy); padding:0 32px;
  display:flex; align-items:center; justify-content:space-between;
  height:60px; position:sticky; top:0; z-index:100;
}
.logo { display:flex; align-items:center; gap:10px; }
.logo-icon { width:36px; height:36px; }
.logo-text { color:#fff; }
.logo-title { font-size:14px; font-weight:700; line-height:1; }
.logo-sub   { font-size:10px; opacity:.75; font-weight:400; }
.header-right { color:rgba(255,255,255,.5); font-size:12px; }

/* Page title */
.page-head {
  background:var(--white); border-bottom:3px solid var(--orange);
  padding:28px 40px 20px;
  display:flex; align-items:flex-end; justify-content:space-between;
}
.page-head h1 {
  font-size:26px; font-weight:800; color:var(--navy);
  letter-spacing:-.02em; margin-bottom:4px;
}
.page-head p { font-size:13px; color:var(--muted); }
.entry-count {
  background:var(--navy); color:#fff;
  padding:6px 14px; border-radius:20px;
  font-size:12px; font-weight:700;
}

/* Main */
main { max-width:820px; margin:32px auto; padding:0 24px 60px; }

/* Filter */
.filter-bar { display:flex; gap:8px; margin-bottom:28px; flex-wrap:wrap; }
.filter-btn {
  padding:7px 16px; border-radius:20px; border:1.5px solid var(--border);
  font-size:12px; font-weight:600; cursor:pointer; background:var(--white);
  color:var(--muted); transition:all .15s; font-family:'Inter',sans-serif;
}
.filter-btn.active, .filter-btn:hover { border-color:var(--navy); color:var(--navy); background:#eef0fb; }

/* Timeline */
.timeline { position:relative; }
.timeline::before {
  content:''; position:absolute; left:20px; top:0; bottom:0;
  width:2px; background:var(--border);
}

/* Entry */
.entry { position:relative; padding-left:56px; margin-bottom:32px; }
.entry-dot {
  position:absolute; left:12px; top:18px;
  width:18px; height:18px; border-radius:50%;
  background:var(--white); border:2px solid var(--navy);
  display:flex; align-items:center; justify-content:center;
  font-size:9px; z-index:1;
}
.entry-card {
  background:var(--white); border-radius:12px;
  border:1px solid var(--border);
  overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
  transition:box-shadow .2s;
}
.entry-card:hover { box-shadow:0 4px 12px rgba(0,0,0,.08); }
.entry-header {
  padding:16px 20px 12px;
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
}
.entry-date {
  font-family:'JetBrains Mono',monospace;
  font-size:12px; font-weight:500; color:var(--muted);
}
.entry-title { font-size:15px; font-weight:700; color:var(--navy); margin-top:2px; }
.entry-tags { display:flex; gap:6px; flex-wrap:wrap; }
.tag {
  padding:3px 10px; border-radius:6px;
  font-size:10px; font-weight:700; letter-spacing:.04em;
}
.tag-init    { background:#dbeafe; color:#1d4ed8; }
.tag-feat    { background:#dcfce7; color:#15803d; }
.tag-fix     { background:#fee2e2; color:#b91c1c; }
.tag-docs    { background:#fef9c3; color:#854d0e; }
.tag-design  { background:#faf5ff; color:#6d28d9; }
.tag-chore   { background:#f1f5f9; color:#475569; }
.tag-refactor{ background:#fff7ed; color:#c2410c; }

.entry-body { padding:14px 20px; }

/* Section dalam entry */
.section { margin-bottom:14px; }
.section:last-child { margin-bottom:0; }
.section-label {
  font-size:11px; font-weight:700; text-transform:uppercase;
  letter-spacing:.07em; margin-bottom:8px;
  display:flex; align-items:center; gap:6px;
}
.section-dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
.change-list { display:flex; flex-direction:column; gap:5px; }
.change {
  display:flex; align-items:flex-start; gap:10px;
  padding:8px 12px; border-radius:7px;
  font-size:13px; line-height:1.4;
}
.change-bullet { flex-shrink:0; margin-top:1px; font-size:14px; line-height:1; }

/* Empty state */
.empty {
  text-align:center; padding:60px 20px;
  color:var(--muted); font-size:14px;
}

/* Footer */
footer {
  background:var(--navy); color:rgba(255,255,255,.6);
  text-align:center; padding:16px; font-size:12px;
}

/* Add entry form */
.add-wrap {
  background:var(--white); border-radius:12px;
  border:1.5px dashed var(--border);
  padding:20px; margin-bottom:32px;
  text-align:center; cursor:pointer;
  transition:all .15s; color:var(--muted); font-size:13px;
}
.add-wrap:hover { border-color:var(--navy); color:var(--navy); background:#f8f9ff; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg class="logo-icon" viewBox="0 0 36 36" fill="none">
      <rect width="36" height="36" rx="8" fill="rgba(255,255,255,0.15)"/>
      <path d="M10 26V14l8-4 8 4v12" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M14 26v-6h8v6" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="18" cy="10" r="2" fill="white"/>
      <path d="M16 8.5 14 6M20 8.5 22 6M18 8 18 5" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    </svg>
    <div class="logo-text">
      <div class="logo-title">DIGILAB REPOSITORY</div>
      <div class="logo-sub">FAKULTAS VOKASI – UNIVERSITAS NEGERI MALANG</div>
    </div>
  </div>
  <div class="header-right">Changelog</div>
</header>

<div class="page-head">
  <div>
    <h1>Changelog</h1>
    <p>Riwayat perubahan project DIGILAB Repository</p>
  </div>
  <div class="entry-count" id="entry-count">1 entri</div>
</div>

<main>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterLog('all',this)">Semua</button>
    <button class="filter-btn" onclick="filterLog('Init',this)">Init</button>
    <button class="filter-btn" onclick="filterLog('Feat',this)">Feat</button>
    <button class="filter-btn" onclick="filterLog('Fix',this)">Fix</button>
    <button class="filter-btn" onclick="filterLog('Design',this)">Design</button>
    <button class="filter-btn" onclick="filterLog('Docs',this)">Docs</button>
    <button class="filter-btn" onclick="filterLog('Chore',this)">Chore</button>
  </div>

  <div class="timeline" id="timeline"></div>

</main>

<footer>Hak cipta 2025 ©Perpustakaan Digital &nbsp;·&nbsp; DIGILAB Repository</footer>

<script>
const changelog = [
  {
    date: '2026-06-09',
    title: 'Setup & Analisis Awal',
    sections: [
      {
        type: 'Init', color: '#1d4ed8', bg: '#dbeafe',
        items: [
          'Inisiasi project DIGILAB Repository dari Proposal Hibah Skripsi 2026',
          'Baca & analisis dokumen proposal penelitian (38 halaman, metode RAD)'
        ]
      },
      {
        type: 'Design', color: '#6d28d9', bg: '#faf5ff',
        items: [
          'Baca 16 file mockup PNG dari folder "Desain Sistem Repositori Natasya"',
          'Baca Mindmap Repositori (4 cabang: Metodologi RAD, Fitur Utama, Alur Sistem, Tujuan Strategis)',
          'Dokumentasi design language: header navy/indigo, aksen oranye, logo DigiLab (buku + sirkuit)'
        ]
      },
      {
        type: 'Docs', color: '#854d0e', bg: '#fef9c3',
        items: [
          'Buat checklist.md — 5 fase, 60+ item berdasarkan mindmap & mockup',
          'Buat changelog.md — template log perubahan project',
          'Buat DIGILAB_MindMap.html — visualisasi interaktif peta penelitian (mindmap + jadwal)',
          'Buat checklist.html — halaman web checklist interaktif (bisa centang, progress bar)',
          'Buat changelog.html — halaman web changelog dengan tampilan timeline'
        ]
      },
      {
        type: 'Chore', color: '#475569', bg: '#f1f5f9',
        items: [
          'Setup struktur folder: frontend/, backend/, database/, design/, docs/, tests/',
          'Setup backend/package.json (Node.js + Express + Sequelize + JWT + multer)',
          'Setup backend/server.js — entry point dengan health check endpoint',
          'Setup backend/.env.example — template konfigurasi environment',
          'Setup frontend/package.json (Vite)',
          'Setup docker-compose.yml — MySQL + backend + frontend untuk local dev',
          'Buat database/migrations/001_create_tables.sql — skema + seed 11 prodi + 6 kategori',
          'Buat frontend/public/index.html — halaman awal (template, belum sesuai desain Natasya)'
        ]
      }
    ]
  }
];

const tagClass = {
  Init:'tag-init', Feat:'tag-feat', Fix:'tag-fix',
  Docs:'tag-docs', Design:'tag-design', Chore:'tag-chore', Refactor:'tag-refactor'
};

const typeEmoji = {
  Init:'🚀', Feat:'✨', Fix:'🐛', Docs:'📝', Design:'🎨', Chore:'🔧', Refactor:'♻️'
};

function render(data) {
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';

  if (!data.length) {
    tl.innerHTML = '<div class="empty">Tidak ada entri untuk filter ini.</div>';
    return;
  }

  data.forEach((entry, i) => {
    const allTags = [...new Set(entry.sections.map(s => s.type))];
    const tagsHTML = allTags.map(t => `<span class="tag ${tagClass[t]||'tag-chore'}">${typeEmoji[t]||''} ${t}</span>`).join('');

    const sectionsHTML = entry.sections.map(s => `
      <div class="section">
        <div class="section-label">
          <span class="section-dot" style="background:${s.color}"></span>
          <span style="color:${s.color}">${typeEmoji[s.type]} ${s.type}</span>
        </div>
        <div class="change-list">
          ${s.items.map(it => `
            <div class="change" style="background:${s.bg}20; border:1px solid ${s.bg}">
              <span class="change-bullet" style="color:${s.color}">→</span>
              <span>${it}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');

    tl.innerHTML += `
      <div class="entry" data-types="${allTags.join(',')}">
        <div class="entry-dot" style="border-color:var(--orange);background:var(--orange);color:white;">
          ${i+1}
        </div>
        <div class="entry-card">
          <div class="entry-header">
            <div>
              <div class="entry-date">${entry.date}</div>
              <div class="entry-title">${entry.title}</div>
            </div>
            <div class="entry-tags">${tagsHTML}</div>
          </div>
          <div class="entry-body">${sectionsHTML}</div>
        </div>
      </div>
    `;
  });

  document.getElementById('entry-count').textContent = `${data.length} entri`;
}

function filterLog(type, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (type === 'all') { render(changelog); return; }
  const filtered = changelog.filter(e => e.sections.some(s => s.type === type));
  render(filtered);
}

render(changelog);
</script>
</body>
</html>
